name: Build Windows VST3 + Installer

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure (MSVC)
        run: cmake -S . -B build -A x64

      - name: Build plugin
        run: cmake --build build --config Release --target BKPOptoGlow_VST3 --parallel

      - name: Build setup wizard (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $plugin = "$env:GITHUB_WORKSPACE\build\BKPOptoGlow_artefacts\Release\VST3\Opto Glow.vst3"
          & $iscc "/DPluginDir=$plugin" "Installer\OptoGlow.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v5
        with:
          name: Opto-Glow-Setup
          path: Installer/Output/Opto-Glow-Setup.exe

      - name: Publish download (GitHub Release)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest "Installer/Output/Opto-Glow-Setup.exe" --title "Opto Glow by ROHIT JI" --notes "Download Opto-Glow-Setup.exe, run it and click Next > Install > Finish."
